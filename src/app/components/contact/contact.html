<section class="contact" id="contact">

  <div class="contact-header">
    <h2 class="section-title">Contact me</h2>
    <div class="scroll-top" (click)="scrollToTop()" aria-label="Scroll to top">
      <img src="img/arrow-up.svg" alt="scroll to top" />
    </div>
  </div>

  <div class="contact-body">

    <div class="contact-info-row">
      <p class="contact-desc">
        Feel free to get in touch with job offers or opportunities such as
        Frontend Developer or Angular Developer roles.
      </p>
      <div class="contact-details">
        <div class="contact-item">
          <img src="img/icon-mail.svg" alt="Email" class="contact-icon" />
          <span>E-mail: lutzboelling&#64;gmx.de</span>
        </div>
        <div class="contact-item">
          <span class="phone-icon">📞</span>
          <span>Tel: +49 157 123 456 68</span>
        </div>
      </div>
    </div>

    <form class="contact-form" (ngSubmit)="send()">

      <div class="form-row">
        <div class="form-field">
          <label>Your name</label>
          <input type="text" [(ngModel)]="name" name="name" required />
        </div>
        <div class="form-field">
          <label>Your Email</label>
          <input type="email" [(ngModel)]="email" name="email" required />
        </div>
      </div>

      <div class="form-field">
        <label>Your Message</label>
        <textarea [(ngModel)]="message" name="message" rows="6" required></textarea>
      </div>

      <label class="privacy-label">
        <input type="checkbox" [(ngModel)]="privacyAccepted" name="privacy" />
        I've read the <a href="#" class="privacy-link">privacy policy</a> and agree to the processing of my data as outlined.
      </label>

      <div class="form-footer">
        <button type="submit" class="btn-send" [disabled]="!privacyAccepted">Send</button>
      </div>

    </form>

  </div>
</section>
