<section class="contact" id="contact">

  <div class="contact-header">
    <h2 class="section-title">{{ ts.t.contact.title }}</h2>
    <div class="scroll-top" (click)="scrollToTop()" aria-label="Scroll to top">
      <img src="img/arrow-up.svg" alt="scroll to top" />
    </div>
  </div>

  <div class="contact-body">

    <div class="contact-info-row">
      <p class="contact-desc">{{ ts.t.contact.desc }}</p>
      <div class="contact-details">
        <div class="contact-item">
          <img src="img/icon-mail.svg" alt="Email" class="contact-icon" />
          <span>E-mail: lutzboelling&#64;gmx.de</span>
        </div>
        <div class="contact-item">
          <span class="phone-icon">📞</span>
          <span>Tel: +49 157 123 456 68</span>
        </div>
      </div>
    </div>

    <form class="contact-form" (ngSubmit)="send()">

      <div class="form-row">
        <div class="form-field">
          <label>{{ ts.t.contact.nameLabel }}</label>
          <input type="text" [(ngModel)]="name" name="name" required />
        </div>
        <div class="form-field">
          <label>{{ ts.t.contact.emailLabel }}</label>
          <input type="email" [(ngModel)]="email" name="email" required />
        </div>
      </div>

      <div class="form-field">
        <label>{{ ts.t.contact.messageLabel }}</label>
        <textarea [(ngModel)]="message" name="message" rows="6" required></textarea>
      </div>

      <label class="privacy-label">
        <input type="checkbox" [(ngModel)]="privacyAccepted" name="privacy" />
        {{ ts.t.contact.privacyText }} <a href="#" class="privacy-link">{{ ts.t.contact.privacyLink }}</a> {{ ts.t.contact.privacyEnd }}
      </label>

      <div class="form-footer">
        <button type="submit" class="btn-send" [disabled]="!privacyAccepted">{{ ts.t.contact.send }}</button>
      </div>

    </form>

  </div>
</section>
