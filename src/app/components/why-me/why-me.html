<section class="why-me" id="why-me">
  <h2 class="section-title">{{ ts.t.whyme.title }}</h2>

  <div class="why-me-content">
    <div class="stats-block">
      <div class="stat-row">
        <img class="stat-icon" [src]="currentIcon" alt="" />
        <p class="typewriter">
          <span class="highlight">{{ ts.t.whyme.prefix }}</span>{{ displayedText() }}<span class="cursor">|</span>
        </p>
      </div>
    </div>

    <div class="description-block">
      <p class="description">{{ ts.t.whyme.description }}</p>
      <button class="btn" (click)="scrollToContact()">{{ ts.t.whyme.button }}</button>
    </div>
  </div>
</section>
