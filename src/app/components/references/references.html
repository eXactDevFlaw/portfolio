<section class="references" id="references">
  <h2 class="section-title">{{ ts.t.references.title }}</h2>

  <div class="cards">
    @for (ref of references; track ref.name) {
      <div class="card">
        <div class="card-content">
          <p class="ref-name">{{ ref.name }}</p>
          <p class="ref-project">Project <span class="accent">{{ ref.project }}</span></p>
          <p class="ref-quote">{{ ref.quote }}</p>
          <a [href]="ref.linkedInUrl" target="_blank" class="ref-link">{{ ts.t.references.linkedin }}</a>
        </div>
      </div>
    }
  </div>
</section>
